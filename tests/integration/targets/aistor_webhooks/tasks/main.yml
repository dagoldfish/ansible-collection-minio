---
- name: Read disposable webhook integration settings
  ansible.builtin.set_fact:
    aistor_it_webhooks_enabled: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_WEBHOOKS') | default('false', true) | bool }}"
    aistor_it_auth:
      endpoint: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_ENDPOINT') }}"
      access_key: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_ACCESS_KEY') }}"
      secret_key: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_SECRET_KEY') }}"
      secure: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_SECURE') | default('true', true) | bool }}"
      validate_certs: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_VALIDATE_CERTS') | default('true', true) | bool }}"
    aistor_it_webhook_endpoint: "{{ lookup('ansible.builtin.env', 'AISTOR_IT_WEBHOOK_ENDPOINT') }}"
    aistor_it_webhook_name: "ansible-webhook-it-{{ 1000000000 | random }}"
  no_log: true

- name: Require explicit disposable-server webhook opt-in
  ansible.builtin.assert:
    that:
      - aistor_it_webhooks_enabled | bool
      - aistor_it_auth.endpoint | length > 0
      - aistor_it_auth.access_key | length > 0
      - aistor_it_auth.secret_key | length > 0
      - aistor_it_webhook_endpoint | length > 0
    fail_msg: >-
      Set AISTOR_IT_WEBHOOKS=true, AISTOR_IT_ENDPOINT, AISTOR_IT_ACCESS_KEY,
      AISTOR_IT_SECRET_KEY and AISTOR_IT_WEBHOOK_ENDPOINT for a disposable server.
      This target may restart MinIO and sends events to the supplied receiver.
  no_log: true

- name: Exercise logger and audit webhook lifecycle
  block:
    - name: Create both webhook targets
      dagoldfish.minio.minio_webhook:
        auth: "{{ aistor_it_auth }}"
        kind: "{{ item }}"
        name: "{{ aistor_it_webhook_name }}"
        endpoint: "{{ aistor_it_webhook_endpoint }}"
        comment: Ansible integration webhook
      loop: [logger, audit]
      register: aistor_it_webhook_create

    - name: Activate webhook configuration if required
      dagoldfish.minio.minio_service:
        auth: "{{ aistor_it_auth }}"
        wait_for_ready: true
      when: aistor_it_webhook_create.results | selectattr('restart_required') | list | length > 0

    - name: Repeat webhook configuration
      dagoldfish.minio.minio_webhook:
        auth: "{{ aistor_it_auth }}"
        kind: "{{ item }}"
        name: "{{ aistor_it_webhook_name }}"
        endpoint: "{{ aistor_it_webhook_endpoint }}"
        comment: Ansible integration webhook
      loop: [logger, audit]
      register: aistor_it_webhook_repeat

    - name: Verify webhook idempotency
      ansible.builtin.assert:
        that:
          - aistor_it_webhook_create.results | selectattr('changed') | list | length == 2
          - aistor_it_webhook_repeat is not changed
          - aistor_it_webhook_repeat.results | selectattr('restart_required') | list | length == 0

    - name: Preview disabling without changing targets
      dagoldfish.minio.minio_webhook:
        auth: "{{ aistor_it_auth }}"
        kind: "{{ item }}"
        name: "{{ aistor_it_webhook_name }}"
        enabled: false
      check_mode: true
      loop: [logger, audit]
      register: aistor_it_webhook_preview

    - name: Verify disable preview
      ansible.builtin.assert:
        that: aistor_it_webhook_preview.results | selectattr('changed') | list | length == 2

  always:
    - name: Remove isolated webhook targets
      dagoldfish.minio.minio_webhook:
        auth: "{{ aistor_it_auth }}"
        kind: "{{ item }}"
        name: "{{ aistor_it_webhook_name }}"
        state: absent
      loop: [logger, audit]
      register: aistor_it_webhook_delete

    - name: Activate webhook removal if required
      dagoldfish.minio.minio_service:
        auth: "{{ aistor_it_auth }}"
        wait_for_ready: true
      when: aistor_it_webhook_delete.results | selectattr('restart_required') | list | length > 0

    - name: Repeat removal of isolated webhook targets
      dagoldfish.minio.minio_webhook:
        auth: "{{ aistor_it_auth }}"
        kind: "{{ item }}"
        name: "{{ aistor_it_webhook_name }}"
        state: absent
      loop: [logger, audit]
      register: aistor_it_webhook_absent

    - name: Verify removal idempotency
      ansible.builtin.assert:
        that: aistor_it_webhook_absent is not changed
