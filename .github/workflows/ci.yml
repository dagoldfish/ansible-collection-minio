---
name: collection validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/captain/minio
    steps:
      - uses: actions/checkout@v6
        with:
          path: ansible_collections/captain/minio
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install ansible-core==2.19.4 minio==7.2.20 pytest ruff
      - name: Run unit and static checks
        run: |
          ruff check .
          ansible-test units --venv
      - name: Build and inspect Galaxy artifact
        run: |
          ansible-galaxy collection build --force
          ansible-galaxy collection install captain-minio-0.1.0.tar.gz -p /tmp/collections
          export ANSIBLE_COLLECTIONS_PATH=/tmp/collections
          for module in minio_user minio_group minio_policy minio_policy_binding minio_service_account minio_site_replication minio_site_replication_info; do
            ansible-doc -t module "captain.minio.$module" >/dev/null
          done
      - name: Run Ansible collection sanity checks
        run: |
          # The wheel-distributed ansible-test 2.19 ansible-doc check mistakes
          # /tmp for an Ansible source checkout. Module docs are checked above.
          ansible-test sanity --venv --skip-test ansible-doc
