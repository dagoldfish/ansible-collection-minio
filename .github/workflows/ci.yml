---
name: collection validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run complete non-live validation
        env:
          VALIDATE_ANSIBLE_CORE_VERSION: "2.21.2"
          VALIDATE_PYTHON: python
        run: ./scripts/validate.sh

  minimum-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: ansible_collections/dagoldfish/minio
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install minimum supported dependencies
        working-directory: ansible_collections/dagoldfish/minio
        run: python -m pip install ansible-core==2.14.18 minio==7.2.20 pytest ruff
      - name: Run minimum-version unit and syntax checks
        working-directory: ansible_collections/dagoldfish/minio
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          PYTHONPATH: ${{ github.workspace }}
          PYTHONPYCACHEPREFIX: /tmp/dagoldfish-minio-pyc
        run: |
          ruff check .
          python -m pytest -q tests/unit
          ansible-playbook playbooks/manage_aistor.yml --syntax-check
          AISTOR_MANAGE=false ansible-playbook playbooks/manage_aistor.yml --check
