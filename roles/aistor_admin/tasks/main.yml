---
- name: Validate AIStor management inputs
  ansible.builtin.assert:
    that:
      - aistor_admin_auth.endpoint | default('') | length > 0
      - aistor_admin_auth.access_key | default('') | length > 0
      - aistor_admin_auth.secret_key | default('') | length > 0
    fail_msg: Set aistor_admin_auth from controller-side secret lookups before enabling management.
  when: aistor_admin_manage | bool
  no_log: true

- name: Reconcile AIStor buckets
  dagoldfish.minio.minio_bucket:
    auth: "{{ aistor_admin_auth }}"
    name: "{{ item.name }}"
    region: "{{ item.region | default(omit) }}"
    object_lock: "{{ item.object_lock | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_buckets }}"
  loop_control: {label: "{{ item.name }}"}
  when: aistor_admin_manage | bool

- name: Reconcile AIStor policies
  dagoldfish.minio.minio_policy:
    auth: "{{ aistor_admin_auth }}"
    name: "{{ item.name }}"
    policy: "{{ item.policy | default(omit) }}"
    policy_file: "{{ item.policy_file | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_policies }}"
  loop_control: {label: "{{ item.name }}"}
  when: aistor_admin_manage | bool

- name: Reconcile AIStor users
  dagoldfish.minio.minio_user:
    auth: "{{ aistor_admin_auth }}"
    access_key: "{{ item.access_key }}"
    secret_key: "{{ item.secret_key | default(omit) }}"
    status: "{{ item.status | default(omit) }}"
    update_secret: "{{ item.update_secret | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_users }}"
  loop_control: {label: "{{ item.access_key }}"}
  when: aistor_admin_manage | bool
  no_log: true

- name: Reconcile AIStor groups
  dagoldfish.minio.minio_group:
    auth: "{{ aistor_admin_auth }}"
    name: "{{ item.name }}"
    members: "{{ item.members | default(omit) }}"
    purge_members: "{{ item.purge_members | default(false) }}"
    status: "{{ item.status | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_groups }}"
  loop_control: {label: "{{ item.name }}"}
  when: aistor_admin_manage | bool

- name: Reconcile AIStor service accounts
  dagoldfish.minio.minio_service_account:
    auth: "{{ aistor_admin_auth }}"
    access_key: "{{ item.access_key }}"
    secret_key: "{{ item.secret_key | default(omit) }}"
    name: "{{ item.name | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    policy: "{{ item.policy | default(omit) }}"
    expiration: "{{ item.expiration | default(omit) }}"
    status: "{{ item.status | default(omit) }}"
    update_secret: "{{ item.update_secret | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_service_accounts }}"
  loop_control: {label: "{{ item.access_key }}"}
  when: aistor_admin_manage | bool
  no_log: true

- name: Reconcile AIStor LDAP providers
  dagoldfish.minio.minio_ldap_provider:
    auth: "{{ aistor_admin_auth }}"
    name: "{{ item.name | default('_') }}"
    server_addr: "{{ item.server_addr | default(omit) }}"
    lookup_bind_dn: "{{ item.lookup_bind_dn | default(omit) }}"
    lookup_bind_password: "{{ item.lookup_bind_password | default(omit) }}"
    update_bind_password: "{{ item.update_bind_password | default(false) }}"
    user_dn_search_base_dn: "{{ item.user_dn_search_base_dn | default(omit) }}"
    user_dn_search_filter: "{{ item.user_dn_search_filter | default(omit) }}"
    user_dn_attributes: "{{ item.user_dn_attributes | default(omit) }}"
    group_search_base_dn: "{{ item.group_search_base_dn | default(omit) }}"
    group_search_filter: "{{ item.group_search_filter | default(omit) }}"
    srv_record_name: "{{ item.srv_record_name | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    enabled: "{{ item.enabled | default(omit) }}"
    tls_skip_verify: "{{ item.tls_skip_verify | default(omit) }}"
    server_insecure: "{{ item.server_insecure | default(omit) }}"
    server_starttls: "{{ item.server_starttls | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_ldap_providers }}"
  loop_control: {label: "{{ item.name | default('_') }}"}
  register: aistor_admin_ldap_reconciliation
  when: aistor_admin_manage | bool
  no_log: true

- name: Initialize AIStor configuration activation state
  ansible.builtin.set_fact:
    _aistor_admin_restart_result: {ready: false}
    _aistor_admin_pending_targets: []

- name: Reconcile AIStor logger webhooks
  dagoldfish.minio.minio_webhook:
    auth: "{{ aistor_admin_auth }}"
    kind: logger
    name: "{{ item.name | default('_') }}"
    endpoint: "{{ item.endpoint | default(omit) }}"
    auth_token: "{{ item.auth_token | default(omit) }}"
    update_auth_token: "{{ item.update_auth_token | default(false) }}"
    enabled: "{{ item.enabled | default(omit) }}"
    client_cert: "{{ item.client_cert | default(omit) }}"
    client_key: "{{ item.client_key | default(omit) }}"
    proxy: "{{ item.proxy | default(omit) }}"
    queue_dir: "{{ item.queue_dir | default(omit) }}"
    queue_size: "{{ item.queue_size | default(omit) }}"
    batch_size: "{{ item.batch_size | default(omit) }}"
    batch_max_size: "{{ item.batch_max_size | default(omit) }}"
    max_retry: "{{ item.max_retry | default(omit) }}"
    retry_interval: "{{ item.retry_interval | default(omit) }}"
    http_timeout: "{{ item.http_timeout | default(omit) }}"
    http_encoding: "{{ item.http_encoding | default(omit) }}"
    tls_skip_verification: "{{ item.tls_skip_verification | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_logger_webhooks }}"
  loop_control: {label: "{{ item.name | default('_') }}"}
  register: aistor_admin_logger_webhook_reconciliation
  when: aistor_admin_manage | bool
  no_log: true

- name: Reconcile AIStor audit webhooks
  dagoldfish.minio.minio_webhook:
    auth: "{{ aistor_admin_auth }}"
    kind: audit
    name: "{{ item.name | default('_') }}"
    endpoint: "{{ item.endpoint | default(omit) }}"
    auth_token: "{{ item.auth_token | default(omit) }}"
    update_auth_token: "{{ item.update_auth_token | default(false) }}"
    enabled: "{{ item.enabled | default(omit) }}"
    client_cert: "{{ item.client_cert | default(omit) }}"
    client_key: "{{ item.client_key | default(omit) }}"
    proxy: "{{ item.proxy | default(omit) }}"
    queue_dir: "{{ item.queue_dir | default(omit) }}"
    queue_size: "{{ item.queue_size | default(omit) }}"
    batch_size: "{{ item.batch_size | default(omit) }}"
    batch_max_size: "{{ item.batch_max_size | default(omit) }}"
    max_retry: "{{ item.max_retry | default(omit) }}"
    retry_interval: "{{ item.retry_interval | default(omit) }}"
    http_timeout: "{{ item.http_timeout | default(omit) }}"
    http_encoding: "{{ item.http_encoding | default(omit) }}"
    tls_skip_verification: "{{ item.tls_skip_verification | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_audit_webhooks }}"
  loop_control: {label: "{{ item.name | default('_') }}"}
  register: aistor_admin_audit_webhook_reconciliation
  when: aistor_admin_manage | bool
  no_log: true

- name: Collect AIStor targets requiring activation
  ansible.builtin.set_fact:
    _aistor_admin_pending_targets: >-
      {{
        (aistor_admin_ldap_reconciliation.results | default([])
          | selectattr('restart_required', 'defined') | selectattr('restart_required')
          | map(attribute='provider.name') | map('regex_replace', '^', 'ldap:') | list)
        + (aistor_admin_logger_webhook_reconciliation.results | default([])
          | selectattr('restart_required', 'defined') | selectattr('restart_required')
          | map(attribute='webhook.name') | map('regex_replace', '^', 'logger:') | list)
        + (aistor_admin_audit_webhook_reconciliation.results | default([])
          | selectattr('restart_required', 'defined') | selectattr('restart_required')
          | map(attribute='webhook.name') | map('regex_replace', '^', 'audit:') | list)
      }}
    _aistor_admin_restart_authorized: >-
      {{ aistor_admin_restart_on_config_change | bool or
         (aistor_admin_restart_on_ldap_change | bool and aistor_admin_ldap_reconciliation is changed) }}
  when: aistor_admin_manage | bool

- name: Schedule AIStor configuration activation
  ansible.builtin.debug:
    msg: "Configuration activation needed for {{ _aistor_admin_pending_targets | join(', ') }}."
  changed_when: true
  notify: Apply AIStor configuration changes
  when:
    - aistor_admin_manage | bool
    - _aistor_admin_pending_targets | length > 0

- name: Apply or report AIStor configuration changes
  ansible.builtin.meta: flush_handlers
  when:
    - aistor_admin_manage | bool
    - _aistor_admin_pending_targets | length > 0

- name: Reconcile AIStor policy bindings
  dagoldfish.minio.minio_policy_binding:
    auth: "{{ aistor_admin_auth }}"
    policies: "{{ item.policies }}"
    user: "{{ item.user | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    identity_provider: "{{ item.identity_provider | default('builtin') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ aistor_admin_policy_bindings }}"
  loop_control: {label: "{{ item.user | default(item.group | default('binding')) }}"}
  when:
    - aistor_admin_manage | bool
    - >-
      item.identity_provider | default('builtin') != 'ldap' or
      _aistor_admin_restart_result.ready | default(false) | bool or
      aistor_admin_ldap_reconciliation is not changed

- name: Reconcile AIStor site replication
  dagoldfish.minio.minio_site_replication:
    auth: "{{ aistor_admin_auth }}"
    sites: "{{ aistor_admin_site_replication.sites | default([]) }}"
    remove_all: "{{ aistor_admin_site_replication.remove_all | default(false) }}"
    force: "{{ aistor_admin_site_replication.force | default(false) }}"
    state: "{{ aistor_admin_site_replication.state | default('present') }}"
    retry_delay: "{{ aistor_admin_site_replication.retry_delay | default(aistor_admin_site_replication_retry_delay) }}"
    retry_timeout: "{{ aistor_admin_site_replication.retry_timeout | default(aistor_admin_site_replication_retry_timeout) }}"
  when:
    - aistor_admin_manage | bool
    - aistor_admin_site_replication | length > 0
  no_log: true
