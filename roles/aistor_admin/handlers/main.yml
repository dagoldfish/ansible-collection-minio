---
- name: Restart AIStor after LDAP configuration changes
  dagoldfish.minio.minio_service:
    auth: "{{ aistor_admin_auth }}"
    action: restart
    wait_for_ready: true
    readiness_delay: "{{ aistor_admin_restart_readiness_delay }}"
    readiness_timeout: "{{ aistor_admin_restart_readiness_timeout }}"
  listen: Apply AIStor LDAP configuration changes
  when: aistor_admin_restart_on_ldap_change | bool
  no_log: true

- name: Report pending AIStor restart
  ansible.builtin.debug:
    msg: >-
      LDAP configuration changed. Restart the AIStor service and run the role
      again to reconcile any deferred LDAP policy bindings.
  listen: Apply AIStor LDAP configuration changes
  when: not (aistor_admin_restart_on_ldap_change | bool)
