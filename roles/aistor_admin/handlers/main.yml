---
- name: Restart AIStor after configuration changes
  dagoldfish.minio.minio_service:
    auth: "{{ aistor_admin_auth }}"
    action: restart
    wait_for_ready: true
    readiness_delay: "{{ aistor_admin_restart_readiness_delay }}"
    readiness_timeout: "{{ aistor_admin_restart_readiness_timeout }}"
  register: _aistor_admin_restart_result
  listen: Apply AIStor configuration changes
  when: _aistor_admin_restart_authorized | bool
  no_log: true

- name: Report pending AIStor restart
  ansible.builtin.debug:
    msg: >-
      {{ 'A restart would be needed' if ansible_check_mode else 'A restart is pending' }}
      for {{ _aistor_admin_pending_targets | join(', ') }}.
      {{ 'LDAP policy bindings are deferred.' if aistor_admin_ldap_reconciliation is changed else '' }}
      Restart with dagoldfish.minio.minio_service and run the role again to finish activation.
      This report covers changes from this invocation only.
  listen: Apply AIStor configuration changes
  when: not (_aistor_admin_restart_authorized | bool) or ansible_check_mode
